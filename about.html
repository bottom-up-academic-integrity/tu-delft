<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title> People | TU Delft for Integrity | A place for moral deliberation for TU Delft members</title>
    <meta
      name="description"
      content="TU Delft for Integrity is a grassroots initiative composed of academic staff, researchers, and students. We are responding to a systemic and structural flaw in how our institution deals with complicity in atrocity crimes. We are united by a shared commitment: to uphold the TU Delft Code of Conduct, to support each other in resisting complicity, and to compel the university to live up to its own values — as well as its obligations under international law. This initiative is rooted in that integrity, and in a belief that safety, justice, and accountability must be collectively defended." />
    <link rel="icon" href="media/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0&icon_names=call_made,volunteer_activism"/>


    <script src="components/header.js" type="text/javascript" defer></script>
    <script src="components/footer.js" type="text/javascript" defer></script>
  </head>  
  <body>
    <header-component></header-component>
    <div id="opening-graphic">
        <div id="opening-image"></div>
        <div id="opening-slogan">Bottom-Up<br>Integrity</div>
    </div>
    
    </div>
    <footer-component></footer-component>

      <!-- SVG filter for images -->
      <svg width="0" height="0" style="position: absolute;">
        <filter id="duotone-deep-blue-white" color-interpolation-filters="sRGB">
          <feColorMatrix
            type="matrix"
            values="
              0.3333 0.3333 0.3333 0 0
              0.3333 0.3333 0.3333 0 0
              0.3333 0.3333 0.3333 0 0
              0 0 0 1 0
            "
            result="grayscale"
          />
      
          <feComponentTransfer color-interpolation-filters="sRGB" in="grayscale">
            <feFuncR type="table" tableValues="0 1" />
            <feFuncG type="table" tableValues="0 1" />
            <feFuncB type="table" tableValues="0.627 1" />
            <feFuncA type="identity" />
          </feComponentTransfer>
        </filter>
      </svg>
  </body>
</html>
